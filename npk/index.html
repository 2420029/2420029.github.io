<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>日ピン研 Viewer</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div style="width:84px;flex-shrink:0"></div>
  <div class="header-title" id="page-title">日ピン研 Viewer</div>
  <div class="header-icon-btn" id="theme-toggle"><i data-lucide="moon"></i></div>
  <div class="header-icon-btn" id="m-reload"><i data-lucide="refresh-cw"></i></div>
</header>

<div id="content-area">
  <div class="container" id="content">
    <div class="initial-logo-loading" aria-label="読み込み中">
      <img src="./npk_logo.png" alt="日ピン研ビューア ロゴ">
      <div id="prog-wrap"><div id="prog-bar"></div></div>
    </div>
  </div>
</div>

<nav id="bottom-nav">
  <div class="nav-btn" id="b-back"><i data-lucide="arrow-left"></i>戻る</div>
  <div class="nav-btn" id="b-home"><i data-lucide="home"></i>TOP</div>
  <div class="nav-btn" id="b-font"><span class="fs-icon">あ</span><span id="font-label">中</span></div>
  <div class="nav-btn" id="b-ext"><i data-lucide="external-link"></i>元サイト</div>
</nav>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/fetch.js"></script>
<script src="js/legacy.js"></script>
<script src="js/router.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
